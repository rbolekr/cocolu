<svg style="max-width:100%; height:auto; display:block;" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="500" fill="#FFFEFB"/>

  <!-- vertical divider -->
  <line x1="400" y1="40" x2="400" y2="460" stroke="#1A1A1A" stroke-width="1.2" opacity="0.12" stroke-dasharray="8 8"/>

  <!-- LEFT: text description -->
  <g font-family="'Poppins', 'Inter', system-ui, sans-serif">
    <text x="48" y="92" font-size="11" letter-spacing="1.6" fill="#1A1A1A" opacity="0.42" font-weight="600">ROUTE 01 — SINGLE LINE</text>
    <text x="48" y="132" font-size="28" fill="#1A1A1A" font-weight="700" letter-spacing="-0.5">Technical Slab</text>
    <text x="48" y="168" font-size="14" fill="#1A1A1A" opacity="0.7" font-weight="400">6b • 14m • 9 holds</text>
    <text x="48" y="210" font-size="13.5" fill="#1A1A1A" opacity="0.62" font-weight="400">A single continuous line up the</text>
    <text x="48" y="230" font-size="13.5" fill="#1A1A1A" opacity="0.62">face. Small crimps, high feet,</text>
    <text x="48" y="250" font-size="13.5" fill="#1A1A1A" opacity="0.62">balanced finish on the slab.</text>
    <!-- subtle stats -->
    <line x1="48" y1="285" x2="320" y2="285" stroke="#1A1A1A" stroke-width="1" opacity="0.08"/>
    <text x="48" y="312" font-size="11" letter-spacing="1.2" fill="#1A1A1A" opacity="0.38" font-weight="600">STYLE</text>
    <text x="48" y="332" font-size="13" fill="#1A1A1A" opacity="0.75">Crimps • Slab • Balance</text>
    <text x="48" y="372" font-size="11" letter-spacing="1.2" fill="#1A1A1A" opacity="0.38" font-weight="600">SETTER</text>
    <text x="48" y="392" font-size="13" fill="#1A1A1A" opacity="0.75">M. Rybak • May 2026</text>
  </g>

  <!-- RIGHT: climbing wall with route -->
  <!-- wall panel -->
  <rect x="442" y="58" width="312" height="386" rx="10" fill="#EDE9E2" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- wood grain hint -->
  <line x1="442" y1="130" x2="754" y2="130" stroke="#1A1A1A" stroke-width="1" opacity="0.08"/>
  <line x1="442" y1="210" x2="754" y2="210" stroke="#1A1A1A" stroke-width="1" opacity="0.08"/>
  <line x1="442" y1="290" x2="754" y2="290" stroke="#1A1A1A" stroke-width="1" opacity="0.08"/>
  <line x1="442" y1="365" x2="754" y2="365" stroke="#1A1A1A" stroke-width="1" opacity="0.06"/>
  <!-- route line - dashed connecting holds -->
  <path d="M 520 405 C 540 360, 560 320, 580 285 S 620 210, 600 165 S 580 115, 620 85" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="7 6" opacity="0.28"/>
  <!-- holds along route - larger, single color progression for single line -->
  <circle cx="520" cy="405" r="15" fill="#E07A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="560" cy="352" r="13" fill="#E07A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="595" cy="298" r="14" fill="#E07A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="565" cy="242" r="12" fill="#E07A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="610" cy="192" r="14" fill="#E07A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="585" cy="135" r="13" fill="#E07A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="630" cy="88" r="15" fill="#E07A5F" stroke="#1A1A1A" stroke-width="1.8" opacity="0.95"/>
  <!-- small footholds off-route faint -->
  <circle cx="480" cy="320" r="6" fill="#1A1A1A" opacity="0.12"/>
  <circle cx="700" cy="250" r="5.5" fill="#1A1A1A" opacity="0.12"/>
  <!-- bottom label -->
  <text x="442" y="472" font-family="'Poppins', system-ui, sans-serif" font-size="11" letter-spacing="1.6" fill="#1A1A1A" opacity="0.38" font-weight="600">CLIMBING WALL — SINGLE ROUTE</text>
</svg>
